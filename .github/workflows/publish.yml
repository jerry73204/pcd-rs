name: Publish

on:
  push:
    tags:
      - "pcd-rs@*"
      - "pcd-rs-derive@*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Determine crate to publish
        id: crate
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          CRATE="${TAG%@*}"
          VERSION="${TAG#*@}"
          echo "name=$CRATE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing $CRATE version $VERSION"

      - name: Wait for pcd-rs-derive on crates.io
        if: steps.crate.outputs.name == 'pcd-rs'
        run: |
          DERIVE_VERSION=$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "pcd-rs-derive") | .version')
          URL="https://crates.io/api/v1/crates/pcd-rs-derive/$DERIVE_VERSION"
          echo "Waiting for pcd-rs-derive $DERIVE_VERSION on crates.io..."
          for i in $(seq 1 60); do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' "$URL")
            if [ "$STATUS" = "200" ]; then
              echo "Found pcd-rs-derive $DERIVE_VERSION"
              exit 0
            fi
            echo "Attempt $i/60: HTTP $STATUS, waiting 10s..."
            sleep 10
          done
          echo "::error::Timed out waiting for pcd-rs-derive $DERIVE_VERSION on crates.io"
          exit 1

      - name: Publish ${{ steps.crate.outputs.name }}
        run: cargo publish -p ${{ steps.crate.outputs.name }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
