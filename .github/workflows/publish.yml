name: Publish to crates.io

on:
  push:
    tags:
      - "pcd-rs@*"
      - "pcd-rs-derive@*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Extract crate name and version from tag
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          CRATE="${TAG%@*}"
          VERSION="${TAG##*@}"
          echo "crate=$CRATE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing $CRATE version $VERSION"

      - name: Validate version matches Cargo.toml
        run: |
          CRATE="${{ steps.tag.outputs.crate }}"
          VERSION="${{ steps.tag.outputs.version }}"
          TOML_VERSION=$(cargo metadata --format-version 1 --no-deps \
            | jq -r --arg c "$CRATE" '.packages[] | select(.name == $c) | .version')
          if [ "$VERSION" != "$TOML_VERSION" ]; then
            echo "::error::Tag version ($VERSION) does not match Cargo.toml version ($TOML_VERSION)"
            exit 1
          fi
          echo "Version $VERSION matches Cargo.toml"

      - name: Get crates.io token via trusted publishing
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Wait for dependency crate
        if: steps.tag.outputs.crate == 'pcd-rs'
        run: |
          DERIVE_VERSION=$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "pcd-rs-derive") | .version')
          URL="https://crates.io/api/v1/crates/pcd-rs-derive/$DERIVE_VERSION"
          echo "Waiting for pcd-rs-derive $DERIVE_VERSION on crates.io..."
          for i in $(seq 1 60); do
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' -H 'User-Agent: pcd-rs-ci' "$URL")
            if [ "$STATUS" = "200" ]; then
              echo "Found pcd-rs-derive $DERIVE_VERSION"
              # Give the index a moment to sync
              sleep 15
              exit 0
            fi
            echo "Attempt $i/60: HTTP $STATUS, waiting 10s..."
            sleep 10
          done
          echo "::error::Timed out waiting for pcd-rs-derive $DERIVE_VERSION on crates.io"
          exit 1

      - name: Publish to crates.io
        run: cargo publish -p ${{ steps.tag.outputs.crate }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
